<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Descubre tu perfil de inversionista en Miami — Porteus Real Estate</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f7f8fa; color: #1a1a1a; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
  .card { background: #fff; border-radius: 20px; box-shadow: 0 4px 32px rgba(0,0,0,0.08); max-width: 600px; width: 100%; padding: 2.5rem 2rem; }
  .logo { text-align: center; margin-bottom: 1.5rem; }
  .logo img { height: 48px; }
  .logo-text { font-size: 13px; color: #888; margin-top: 4px; }
  .progress-bg { height: 5px; background: #eee; border-radius: 3px; margin-bottom: 2rem; }
  .progress-fill { height: 5px; background: #1D9E75; border-radius: 3px; transition: width 0.4s ease; }
  .block-label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #1D9E75; font-weight: 600; margin-bottom: 0.5rem; }
  .question { font-size: 20px; font-weight: 600; color: #111; margin-bottom: 1.5rem; line-height: 1.4; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 2rem; }
  .opt { background: #fff; border: 1.5px solid #e5e7eb; border-radius: 12px; padding: 14px 18px; font-size: 15px; color: #222; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 14px; transition: border-color 0.15s, background 0.15s; }
  .opt:hover { border-color: #1D9E75; background: #f0faf6; }
  .opt.selected { border-color: #1D9E75; background: #e8f8f2; color: #085041; }
  .opt-letter { width: 30px; height: 30px; border-radius: 50%; background: #f0f0f0; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: #666; flex-shrink: 0; }
  .opt.selected .opt-letter { background: #1D9E75; color: #fff; }
  .nav { display: flex; justify-content: space-between; align-items: center; }
  .btn-back { background: transparent; border: 1.5px solid #ddd; border-radius: 10px; padding: 11px 22px; font-size: 14px; color: #555; cursor: pointer; }
  .btn-back:hover { background: #f5f5f5; }
  .btn-back:disabled { opacity: 0.3; cursor: default; }
  .btn-next { background: #1D9E75; border: none; border-radius: 10px; padding: 12px 28px; font-size: 15px; font-weight: 600; color: #fff; cursor: pointer; transition: background 0.15s; }
  .btn-next:hover { background: #0F6E56; }
  .btn-next:disabled { background: #ccc; cursor: default; }
  .q-count { font-size: 13px; color: #aaa; }

  /* Capture form */
  .capture { text-align: center; }
  .capture h2 { font-size: 22px; font-weight: 700; margin-bottom: 0.5rem; }
  .capture p { font-size: 15px; color: #666; margin-bottom: 1.5rem; line-height: 1.6; }
  .form-group { margin-bottom: 14px; text-align: left; }
  .form-group label { font-size: 13px; font-weight: 600; color: #444; display: block; margin-bottom: 6px; }
  .form-group input { width: 100%; padding: 13px 16px; border: 1.5px solid #e5e7eb; border-radius: 10px; font-size: 15px; color: #111; outline: none; }
  .form-group input:focus { border-color: #1D9E75; }
  .btn-submit { width: 100%; background: #1D9E75; border: none; border-radius: 12px; padding: 15px; font-size: 16px; font-weight: 700; color: #fff; cursor: pointer; margin-top: 8px; transition: background 0.15s; }
  .btn-submit:hover { background: #0F6E56; }
  .privacy { font-size: 12px; color: #aaa; margin-top: 10px; }

  /* Result */
  .result { text-align: center; }
  .result-badge { display: inline-block; padding: 6px 20px; border-radius: 999px; font-size: 13px; font-weight: 600; margin-bottom: 1rem; }
  .result-title { font-size: 26px; font-weight: 700; margin-bottom: 0.75rem; }
  .result-desc { font-size: 15px; color: #555; line-height: 1.7; margin-bottom: 1.5rem; }
  .result-box { background: #f7f8fa; border-radius: 14px; padding: 1.25rem; text-align: left; margin-bottom: 1.5rem; }
  .result-box-title { font-size: 12px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
  .result-item { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: #333; margin-bottom: 8px; line-height: 1.5; }
  .result-item:last-child { margin-bottom: 0; }
  .check { color: #1D9E75; font-size: 18px; flex-shrink: 0; margin-top: 0px; }
  .btn-cta { display: block; width: 100%; background: #1D9E75; border: none; border-radius: 12px; padding: 16px; font-size: 16px; font-weight: 700; color: #fff; cursor: pointer; margin-bottom: 12px; text-decoration: none; transition: background 0.15s; }
  .btn-cta:hover { background: #0F6E56; }
  .btn-restart { background: transparent; border: none; font-size: 13px; color: #aaa; cursor: pointer; text-decoration: underline; }
  .divider { height: 1px; background: #eee; margin: 1.5rem 0; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div style="font-size:18px; font-weight:700; color:#1D9E75;">Porteus Real Estate</div>
    <div class="logo-text">Bienes Raíces en USA para Latinos</div>
  </div>

  <!-- Quiz screen -->
  <div id="quiz-screen">
    <div class="progress-bg"><div class="progress-fill" id="progress" style="width:12.5%"></div></div>
    <div class="block-label" id="block-label"></div>
    <div class="question" id="question-text"></div>
    <div class="options" id="options-list"></div>
    <div class="nav">
      <button class="btn-back" id="back-btn" onclick="goBack()" disabled>← Atrás</button>
      <span class="q-count" id="q-count">1 / 8</span>
      <button class="btn-next" id="next-btn" onclick="goNext()" disabled>Siguiente →</button>
    </div>
  </div>

  <!-- Capture screen -->
  <div id="capture-screen" style="display:none">
    <div class="capture">
      <div style="font-size:40px; margin-bottom:1rem;">🎯</div>
      <h2>¡Ya casi tienes tu resultado!</h2>
      <p>Déjanos tus datos y te mostramos tu perfil de inversionista personalizado al instante.</p>
      <div class="form-group">
        <label>Nombre completo</label>
        <input type="text" id="inp-nombre" placeholder="Tu nombre" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="inp-email" placeholder="tu@email.com" />
      </div>
      <div class="form-group">
        <label>WhatsApp (con código de país)</label>
        <input type="tel" id="inp-whatsapp" placeholder="+57 300 000 0000" />
      </div>
      <button class="btn-submit" onclick="submitCapture()">Ver mi perfil →</button>
      <p class="privacy">Tu información es privada. Sin spam, prometido.</p>
    </div>
  </div>

  <!-- Result screen -->
  <div id="result-screen" style="display:none"></div>
</div>

<script>
const questions = [
  { block: "Bloque 1 — Quién eres", text: "¿Dónde vives actualmente?", opts: ["En Latinoamérica (fuera de USA)", "En USA, pero soy de origen latino", "En USA hace menos de 2 años", "En otro país fuera de LATAM"] },
  { block: "Bloque 1 — Quién eres", text: "¿Cuál es tu situación financiera actual?", opts: ["Ahorro todos los meses, tengo algo guardado", "Tengo capital disponible listo para invertir", "Estoy en proceso de ahorrar", "Tengo capital en propiedades u otros activos"] },
  { block: "Bloque 1 — Quién eres", text: "¿Has invertido antes en bienes raíces?", opts: ["Nunca, sería mi primera vez", "Sí, en mi país de origen", "Sí, en USA u otro país desarrollado", "Tengo propiedades pero no las considero inversión"] },
  { block: "Bloque 2 — Qué sabes", text: "¿Qué tan familiarizado estás con el proceso de compra en USA?", opts: ["No sé nada del proceso", "Conozco los pasos básicos", "Entiendo el proceso bastante bien", "Tengo experiencia directa comprando en USA"] },
  { block: "Bloque 2 — Qué sabes", text: "¿Sabes si puedes comprar en Miami sin vivir en USA?", opts: ["No, pensaba que era imposible", "Escuché que se puede pero no sé cómo", "Sé que se puede con una LLC u otra estructura", "Sí, ya tengo una empresa creada o en proceso"] },
  { block: "Bloque 2 — Qué sabes", text: "¿Conoces los costos reales más allá del precio de lista?", opts: ["No, solo conozco el precio de la propiedad", "Sé que hay costos extra pero no los conozco bien", "Conozco HOA, taxes y costos de cierre", "Tengo una hoja de cálculo con todos los costos"] },
  { block: "Bloque 3 — Qué tienes", text: "¿Cuánto capital tienes disponible para invertir?", opts: ["Menos de $30,000", "Entre $30,000 y $80,000", "Entre $80,000 y $150,000", "Más de $150,000"] },
  { block: "Bloque 3 — Qué tienes", text: "¿En cuánto tiempo quieres dar el primer paso real?", opts: ["Todavía estoy explorando, sin prisa", "En los próximos 6 a 12 meses", "En los próximos 3 meses", "Ya estoy listo, quiero actuar ahora"] }
];

const profiles = [
  { label: "El Curioso", badge: "Etapa inicial", badgeColor: "#FEF3C7", badgeText: "#92400E", desc: "Estás en el punto de partida perfecto. Tienes la intención y la curiosidad, pero todavía necesitas construir la base de conocimiento. Con la información correcta, estás mucho más cerca de lo que crees.", items: ["Entender si puedes invertir siendo extranjero (sí puedes)", "Conocer los costos reales del mercado de Miami", "Identificar qué tipo de propiedad se adapta a tu situación", "Leer los 5 errores más comunes antes de empezar"], cta: "Descarga gratis: Los 5 Errores que Cometen los Latinos →", ctaUrl: "https://nas.io/bienes-raices-en-usa" },
  { label: "El que se está Preparando", badge: "En camino", badgeColor: "#D1FAE5", badgeText: "#065F46", desc: "Tienes interés real y ya tienes algo de capital o conocimiento básico. Solo te falta el mapa completo: el proceso paso a paso, la estructura correcta y los números reales.", items: ["El proceso de compra de principio a fin", "Cómo estructurar tu inversión siendo extranjero", "Qué zonas de Miami tienen mejor retorno", "Cómo calcular si una propiedad realmente te conviene"], cta: "Quiero la guía completa — Invierte en Miami 2026 →", ctaUrl: "https://nas.io/bienes-raices-en-usa" },
  { label: "El Casi Listo", badge: "Muy cerca", badgeColor: "#A7F3D0", badgeText: "#064E3B", desc: "Tienes capital, conocimiento básico y urgencia. Lo que necesitas es el paso a paso concreto para no cometer errores costosos en las etapas finales. Estás muy cerca de tu primera inversión.", items: ["El detalle de cada etapa del proceso de cierre", "Cómo financiar siendo extranjero sin historial crediticio en USA", "Qué preguntar antes de hacer una oferta", "Cómo administrar la propiedad sin vivir allá"], cta: "Quiero la guía completa — Invierte en Miami 2026 →", ctaUrl: "https://nas.io/bienes-raices-en-usa" },
  { label: "El Inversionista", badge: "Modo avanzado", badgeColor: "#DBEAFE", badgeText: "#1E3A8A", desc: "Ya tienes experiencia y capital. Tu próximo nivel es optimizar, escalar o diversificar tu portafolio en Miami con estrategias avanzadas de retorno.", items: ["Comparativa de zonas de mayor ROI en Miami 2026", "Airbnb vs arrendamiento: qué conviene según tu perfil", "Cómo escalar de 1 a múltiples propiedades", "Estructuras fiscales para inversionistas avanzados"], cta: "Quiero hablar con un experto de Porteus →", ctaUrl: "https://nas.io/bienes-raices-en-usa" }
];

let current = 0;
let answers = new Array(8).fill(null);
let userData = {};

function getProfile() {
  let score = 0;
  const w = [1,1,2,2,2,2,3,3];
  answers.forEach((a,i) => { if (a !== null) score += a * w[i]; });
  const max = w.reduce((s,v) => s + v*3, 0);
  const pct = score / max;
  if (pct < 0.25) return profiles[0];
  if (pct < 0.5) return profiles[1];
  if (pct < 0.75) return profiles[2];
  return profiles[3];
}

function render() {
  const q = questions[current];
  document.getElementById("block-label").textContent = q.block;
  document.getElementById("question-text").textContent = q.text;
  document.getElementById("q-count").textContent = (current+1) + " / 8";
  document.getElementById("progress").style.width = (((current+1)/8)*100) + "%";
  document.getElementById("back-btn").disabled = current === 0;
  document.getElementById("next-btn").disabled = answers[current] === null;
  document.getElementById("next-btn").textContent = current === 7 ? "Ver mi resultado →" : "Siguiente →";
  const letters = ["A","B","C","D"];
  const list = document.getElementById("options-list");
  list.innerHTML = "";
  q.opts.forEach((opt,i) => {
    const btn = document.createElement("button");
    btn.className = "opt" + (answers[current] === i ? " selected" : "");
    btn.innerHTML = '<span class="opt-letter">'+letters[i]+'</span><span>'+opt+'</span>';
    btn.onclick = () => { answers[current] = i; render(); };
    list.appendChild(btn);
  });
}

function goNext() {
  if (current < 7) { current++; render(); }
  else showCapture();
}

function goBack() {
  if (current > 0) { current--; render(); }
}

function showCapture() {
  document.getElementById("quiz-screen").style.display = "none";
  document.getElementById("capture-screen").style.display = "block";
}

function submitCapture() {
  const nombre = document.getElementById("inp-nombre").value.trim();
  const email = document.getElementById("inp-email").value.trim();
  const whatsapp = document.getElementById("inp-whatsapp").value.trim();
  if (!nombre || !email || !whatsapp) { alert("Por favor completa todos los campos."); return; }
  userData = { nombre, email, whatsapp };
  document.getElementById("capture-screen").style.display = "none";
  showResult();
}

function showResult() {
  const p = getProfile();
  const rs = document.getElementById("result-screen");
  rs.style.display = "block";
  rs.innerHTML = `
    <div class="result">
      <div style="font-size:48px; margin-bottom:1rem;">🎯</div>
      <div class="result-badge" style="background:${p.badgeColor}; color:${p.badgeText};">${p.badge}</div>
      <div class="result-title">Tu perfil: ${p.label}</div>
      <div class="result-desc">${p.desc}</div>
      <div class="result-box">
        <div class="result-box-title">Lo que necesitas ahora mismo</div>
        ${p.items.map(it => `<div class="result-item"><span class="check">✓</span><span>${it}</span></div>`).join("")}
      </div>
      <a class="btn-cta" href="${p.ctaUrl}" target="_blank">${p.cta}</a>
      <div class="divider"></div>
      <button class="btn-restart" onclick="restart()">Volver a hacer el quiz</button>
    </div>
  `;
}

function restart() {
  current = 0;
  answers = new Array(8).fill(null);
  userData = {};
  document.getElementById("result-screen").style.display = "none";
  document.getElementById("capture-screen").style.display = "none";
  document.getElementById("quiz-screen").style.display = "block";
  render();
}

render();
</script>
</body>
</html>
